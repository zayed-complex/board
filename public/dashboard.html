<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎓 لوحة التحكم</title>
  <style>
    body {
      font-family: "Tahoma", Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 🔹 الشريط العلوي */
    header {
      background: #2c3e50;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    header img {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      background: white;
      padding: 4px;
      margin-bottom: 6px;
    }

    .school-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 3px;
      color: #ecf0f1;
    }

    #pageTitle {
      font-size: 17px;
      color: #dce3e9;
    }

    /* زر القائمة للجوال */
    #toggleBtn {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      background: transparent;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

    /* 🔹 الحاوية الرئيسية */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* 🔹 السايدبار */
    #sidebar {
      width: 280px;
      background: #2c3e50;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 10px;
      box-shadow: -2px 0 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
      z-index: 1000;
    }

    #sidebar.hidden {
      transform: translateX(100%);
    }

    #menuContainer {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding: 0 5px;
    }

    .button {
      width: 100%;
      padding: 10px 12px;
      background: #3498db;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }

    .button:hover {
      background: #217dbb;
    }

    .btn-danger {
      background-color: #e74c3c;
    }

    .btn-danger:hover {
      background-color: #c0392b;
    }

    #navControls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }

    /* 🔹 منطقة عرض PDF */
    #pdfContainer {
      flex: 1;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      overflow: hidden;
      position: relative;
    }

    #pdfViewer {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
    }

    /* 🔹 الخلفية للقائمة الجانبية في الجوال */
    #overlay {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 900;
    }

    /* 🔹 تصميم الجوال */
    @media (max-width: 768px) {
      #toggleBtn {
        display: block;
      }

      header {
        padding: 15px 40px;
      }

      #sidebar {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        transform: translateX(100%);
      }

      #sidebar.active {
        transform: translateX(0);
      }

      #overlay.active {
        display: block;
      }

      #pdfContainer {
        height: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- 🔹 الشريط العلوي -->
  <header>
    <button id="toggleBtn" title="فتح القائمة">☰</button>
    <img src="/icons/logo.png" alt="شعار المدرسة" />
    <div class="school-name">مجمع زايد التعليمي - الظيت</div>
    <div id="pageTitle">🎓 لوحة التحكم</div>
  </header>

  <!-- 🔹 تراك القائمة -->
  <div id="overlay"></div>

  <!-- 🔹 المحتوى الرئيسي -->
  <div class="main">
    <!-- السايدبار -->
    <div id="sidebar">
      <div id="menuContainer"></div>

      <div id="navControls">
        <button id="backBtn" class="button">🔙 رجوع للرئيسية</button>
        <button id="exitBtn" class="button btn-danger">❌ إنهاء</button>
      </div>
    </div>

    <!-- منطقة الـ PDF -->
    <div id="pdfContainer">
      <iframe id="pdfViewer"></iframe>
    </div>
  </div>

  <script>
    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("toggleBtn");
    const overlay = document.getElementById("overlay");
    const menuContainer = document.getElementById("menuContainer");
    const pdfViewer = document.getElementById("pdfViewer");
    const pageTitle = document.getElementById("pageTitle");

    toggleBtn.onclick = () => {
      sidebar.classList.toggle("active");
      overlay.classList.toggle("active");
    };
    overlay.onclick = () => {
      sidebar.classList.remove("active");
      overlay.classList.remove("active");
    };

    const params = new URLSearchParams(window.location.search);
    const role = params.get("role") || sessionStorage.getItem("role") || "student";
    const section = params.get("section") || sessionStorage.getItem("section") || "male";
    sessionStorage.setItem("role", role);
    sessionStorage.setItem("section", section);

    pageTitle.textContent =
      role === "staff"
        ? "🎓 لوحة تحكم الكادر الإداري والتدريسي"
        : "🎓 لوحة تحكم الطالب / ولي الأمر";

    const BASE_URL = window.location.origin.includes("localhost")
      ? "http://localhost:3000"
      : window.location.origin;

    fetch(`${BASE_URL}/api/menu/${role}/${section}`)
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then((menuItems) => renderMenu(menuItems))
      .catch((err) => {
        console.error("خطأ في تحميل القائمة:", err);
        menuContainer.innerHTML =
          "<p style='color:red;text-align:center;'>❌ تعذر تحميل القائمة من الخادم.</p>";
      });

    function renderMenu(menu) {
      menuContainer.innerHTML = "";
      menu.forEach((item) => {
        const btn = document.createElement("button");
        btn.className = "button";
        btn.textContent = item.title;
        btn.onclick = () => handleMenuClick(item);
        menuContainer.appendChild(btn);
      });
    }

    function handleMenuClick(item) {
      sidebar.classList.remove("active");
      overlay.classList.remove("active");

      switch (item.type) {
        case "pdf":
          openPdf(item.filename);
          break;
        case "submenu":
          window.location.href = `policies.html?role=${item.role || role}`;
          break;
        case "page":
          window.location.href = `${item.path}?role=${role}&section=${section}`;
          break;
        case "external":
          window.open(item.url, "_blank", "noopener,noreferrer");
          break;
      }
    }

    function openPdf(filename) {
      const pdfUrl = `${BASE_URL}/pdfs/${filename}`;
      pdfViewer.src = `/pdfjs/web/viewer.html?file=${encodeURIComponent(pdfUrl)}`;
    }

    document.getElementById("backBtn").onclick = () =>
      (window.location.href = "./index.html");

    document.getElementById("exitBtn").onclick = () => {
      if (window.matchMedia("(display-mode: standalone)").matches) {
        window.close();
      } else {
        document.body.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;text-align:center;font-family:sans-serif;">
            <h2>👋 تم إنهاء الجلسة</h2>
            <p>يمكنك الآن إغلاق الصفحة أو العودة لاحقًا.</p>
            <button onclick="window.location.href='./index.html'" style="margin-top:20px;padding:10px 20px;border:none;border-radius:8px;background:#2563eb;color:white;font-size:16px;">
              🔁 عودة للرئيسية
            </button>
          </div>
        `;
      }
    };
  </script>
</body>
</html>
