<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>📋 لوحة التحكم</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <img src="/icons/logo.png" alt="شعار المدرسة" width="70">
    <h1>مجمع زايد التعليمي - الظيت</h1>
  </header>

  <div class="container">
    <div id="menu" class="menu"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const role = params.get("role") || sessionStorage.getItem("role") || "student";
    const section = params.get("section") || sessionStorage.getItem("section") || "male";
    sessionStorage.setItem("role", role);
    sessionStorage.setItem("section", section);

    async function loadMenu() {
      const res = await fetch(`/api/menu/${role}/${section}`);
      const items = await res.json();
      const menuDiv = document.getElementById("menu");
      menuDiv.innerHTML = "";

      items.forEach(item => {
        const div = document.createElement("div");
        div.className = "menu-item";
        if (item.type === "pdf") {
          div.innerHTML = `<a href="/pdf/${item.filename}" target="_blank">${item.title}</a>`;
        } else if (item.type === "external") {
          div.innerHTML = `<a href="${item.url}" target="_blank">${item.title}</a>`;
        } else if (item.type === "page") {
          div.innerHTML = `<a href="${item.path}?role=${role}&section=${section}">${item.title}</a>`;
        } else if (item.type === "submenu") {
          div.innerHTML = `<a href="/policies.html?role=${item.role}">${item.title}</a>`;
        }
        menuDiv.appendChild(div);
      });
    }

    loadMenu();
  </script>
</body>
</html>
