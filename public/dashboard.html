<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الصفحة الرئيسية - مجمع زايد التعليمي</title>
<style>
body { font-family: "Tahoma", Arial, sans-serif; background:#f5f7fa; padding:20px; text-align:center; }
h1 { color:#333; }
.menu { display:flex; flex-wrap:wrap; justify-content:center; gap:15px; margin-top:25px; }
.card {
  background:#fff; border-radius:15px; padding:20px; box-shadow:0 2px 5px rgba(0,0,0,0.1);
  width:220px; cursor:pointer; transition:0.2s;
}
.card:hover { transform:scale(1.05); background:#eef5ff; }
footer { margin-top:50px; color:#777; font-size:0.9em; }
#loading { margin-top:40px; color:#666; font-size:18px; }
</style>
</head>
<body>

<h1>🏫 لوحة التحكم</h1>
<p id="roleLabel"></p>

<div id="menuContainer" class="menu"></div>
<p id="loading">جارٍ تحميل البيانات...</p>

<div style="margin-top:40px;">
  <button onclick="goBack()">⬅️ رجوع</button>
  <button onclick="logout()">🚪 إنهاء</button>
</div>

<footer>
  <p>© جميع الحقوق محفوظة - مجمع زايد التعليمي - الظيت</p>
</footer>

<script>
const params = new URLSearchParams(window.location.search);
const role = params.get("role");
const section = params.get("section");

document.getElementById("roleLabel").textContent =
  role === "staff" ? "🧑‍🏫 دخول المعلمين والإداريين" : "👨‍🎓 دخول الطلاب وأولياء الأمور";

async function loadMenu() {
  try {
    const res = await fetch(`http://localhost:3000/api/menu/${role}`);
    if (!res.ok) throw new Error("فشل الاتصال بالخادم");
    const menu = await res.json();

    const container = document.getElementById("menuContainer");
    const loading = document.getElementById("loading");
    loading.style.display = "none";

    menu.forEach(item => {
      const div = document.createElement("div");
      div.className = "card";
      div.textContent = item.title;

      div.onclick = () => {
        if (item.type === "pdf") {
          window.open(`http://localhost:3000/api/pdfs/${item.filename}`, "_blank");
        } else if (item.type === "external") {
          window.open(item.url, "_blank");
        } else if (item.type === "page") {
          window.location.href = item.path;
        } else if (item.type === "submenu") {
          window.location.href = `policies.html?role=${role}`;
        }
      };

      container.appendChild(div);
    });
  } catch (err) {
    console.error(err);
    document.getElementById("loading").textContent = "❌ تعذر تحميل القائمة";
  }
}

function goBack() {
  window.location.href = "index.html";
}

function logout() {
  sessionStorage.clear();
  window.location.href = "index.html";
}

loadMenu();
</script>

</body>
</html>
