<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>لوحة التحكم</h1>
  </header>

  <main id="menu"></main>

  <script>
    // قراءة المتغيرات من الرابط أو من التخزين
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get("role") || sessionStorage.getItem("role") || "student";
    const section = urlParams.get("section") || sessionStorage.getItem("section") || "male";

    // تخزين القيم للاستخدام لاحقًا
    sessionStorage.setItem("role", role);
    sessionStorage.setItem("section", section);

    // تحميل القائمة من السيرفر
    async function loadMenu() {
      const res = await fetch(`/api/menu/${role}/${section}`);
      const items = await res.json();

      const container = document.getElementById("menu");
      container.innerHTML = "";

      items.forEach(item => {
        const div = document.createElement("div");
        div.className = "menu-item";
        div.textContent = item.title;

        div.addEventListener("click", () => {
          if (item.type === "pdf") {
            window.open(`/${item.filename}`, "_blank");
          } else if (item.type === "external") {
            window.open(item.url, "_blank");
          } else if (item.type === "page") {
            // ✅ هنا التعديل المهم: نمرر role وsection للرابط
            window.location.href = `${item.path}?role=${role}&section=${section}`;
          } else if (item.type === "submenu") {
            window.location.href = `/policies.html?role=${role}`;
          }
        });

        container.appendChild(div);
      });
    }

    loadMenu();
  </script>
</body>
</html>
