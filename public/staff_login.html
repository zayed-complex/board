<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - مجمّع زايد التعليمي- الظيت / قسم الإناث</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header>
    <h1>🔐 نظام الدخول الموحّد</h1>
  </header>

  <main class="container centered">
    <h2>مرحباً بك مجمّع زايد التعليمي- الظيت / قسم الإناث</h2>

    <label for="role">اختر الدور</label>
    <select id="role" class="input">
      <option value="">-- اختر الدور --</option>
      <option value="student">👨‍🎓 طالب / ولي الأمر</option>
      <option value="staff">🧑‍🏫 معلم / إداري</option>
    </select>

    <div id="staffLoginFields" style="display:none">
      <label for="username">اسم المستخدم</label>
      <input type="text" id="username" class="input" placeholder="أدخل اسم المستخدم" />
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" class="input" placeholder="أدخل كلمة المرور" />
    </div>

    <button class="btn" onclick="login()">تسجيل الدخول</button>
    <p id="loginMessage" style="color:red; margin-top:10px;"></p>
  </main>

  <footer>
    <p>© جميع الحقوق محفوظة - مجمّع زايد التعليمي- الظيت</p>
  </footer>

  <script>
    const roleSelect = document.getElementById("role");
    const staffFields = document.getElementById("staffLoginFields");
    roleSelect.addEventListener("change", () => {
      staffFields.style.display = roleSelect.value === "staff" ? "block" : "none";
    });

    function login() {
      const role = roleSelect.value;
      const msg = document.getElementById("loginMessage");
      msg.textContent = "";

      if (!role) { msg.textContent = "❌ يرجى اختيار الدور"; return; }

      if (role === "student") {
        sessionStorage.setItem("role", "student");
        window.location.href = "dashboard.html";
      } else if (role === "staff") {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        if (!username || !password) { msg.textContent = "❌ يرجى تعبئة جميع الحقول"; return; }

        // محاكاة تحقق (يمكن ربطه بالسيرفر لاحقاً)
        if (username === "admin" && password === "1234") {
          sessionStorage.setItem("role", "staff");
          window.location.href = "dashboard.html";
        } else {
          msg.textContent = "❌ بيانات الدخول غير صحيحة";
        }
      }
    }
  </script>
</body>
</html>
