<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📄 السياسات</title>
<style>
/* ============ الأساس العام ============ */
body {
  font-family: "Tahoma", Arial, sans-serif;
  background-color: #f5f6fa;
  margin: 0;
  padding: 0;
  direction: rtl;
  text-align: center;
}

/* ============ رأس الصفحة ============ */
header {
  background: #2c3e50;
  color: #fff;
  padding: 15px;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 5px;
  box-shadow: 0 3px 6px rgba(0,0,0,0.15);
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.header-top img {
  width: 60px;
  height: 60px;
  border-radius: 8px;
  background: #fff;
  padding: 4px;
}

.school-name {
  font-size: 18px;
  color: #ecf0f1;
  margin: 0;
}

/* ============ الحاوية الرئيسية ============ */
.container {
  margin: 30px auto;
  max-width: 1000px;
  background: #fff;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* ============ الأزرار الموحدة ============ */
.button {
  padding: 10px 18px;
  font-size: 1em;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  color: #fff;
  transition: 0.25s;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 6px;
}
.btn-primary { background-color: #2980b9; }
.btn-primary:hover { background-color: #3498db; }
.btn-danger { background-color: #e74c3c; }
.btn-danger:hover { background-color: #c0392b; }
.btn-warning { background-color: #f39c12; }
.btn-warning:hover { background-color: #d68910; }
.btn-info { background-color: #16a085; }
.btn-info:hover { background-color: #13876b; }

/* ============ الأقسام ============ */
#policyMenu {
  margin: 20px auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

#policyContainer {
  display: none;
  width: 100%;
  margin-top: 20px;
}

#policyViewer {
  width: 100%;
  height: 600px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

#errorMessage {
  color: red;
  margin-top: 15px;
  font-weight: bold;
}

#pdfControls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 15px;
}

/* ============ استجابة الشاشات الصغيرة ============ */
@media (max-width: 768px) {
  .container {
    width: 95%;
    padding: 15px;
  }
  .button {
    width: 100%;
  }
  #policyViewer {
    height: 80vh;
  }
}
</style>
</head>
<body>

<!-- رأس الصفحة -->
<header>
  <div class="header-top">
    <img src="logo.png" alt="شعار المدرسة">
    <div>
      <h2>مجمع زايد التعليمي - الظيت</h2>
      <p class="school-name">📄 صفحة السياسات</p>
    </div>
  </div>
</header>

<!-- الحاوية -->
<div class="container">

  <div style="margin-bottom: 15px;">
    <button id="backBtn" class="button btn-info">🏠 العودة للرئيسية</button>
    <button id="exitBtn" class="button btn-danger">🚪 إنهاء الجلسة</button>
  </div>

  <h2 id="pageTitle">📄 السياسات</h2>

  <div id="policyMenu"></div>
  <div id="errorMessage"></div>

  <div id="policyContainer">
    <div id="pdfControls">
      <button class="button btn-primary" id="downloadBtn">⬇ تحميل PDF</button>
      <button class="button btn-warning" id="printBtn">🖨️ طباعة</button>
      <button class="button btn-danger" id="closeBtn">❌ إغلاق</button>
    </div>
    <iframe id="policyViewer"></iframe>
  </div>
</div>

<script>
// ==================== إعداد الصفحة ====================
const policyMenu = document.getElementById("policyMenu");
const policyContainer = document.getElementById("policyContainer");
const policyViewer = document.getElementById("policyViewer");
const downloadBtn = document.getElementById("downloadBtn");
const printBtn = document.getElementById("printBtn");
const closeBtn = document.getElementById("closeBtn");
const pageTitle = document.getElementById("pageTitle");
const errorMessage = document.getElementById("errorMessage");

const params = new URLSearchParams(window.location.search);
const role = params.get("role") || sessionStorage.getItem("role") || "student";

pageTitle.textContent = role === "staff"
  ? "📋 سياسات الكادر الإداري والتدريسي"
  : "📋 سياسات الطالب / ولي الأمر";

// ==================== تحميل السياسات ====================
fetch(`/api/policies/${role}`)
  .then(res => {
    if (!res.ok) throw new Error(`خطأ في استجابة السيرفر (${res.status})`);
    return res.json();
  })
  .then(policies => {
    if (!Array.isArray(policies) || policies.length === 0) {
      errorMessage.textContent = "⚠️ لا توجد سياسات متاحة حالياً.";
      return;
    }
    renderPolicyMenu(policies);
  })
  .catch(err => {
    console.error("خطأ في تحميل السياسات:", err);
    errorMessage.textContent = "❌ تعذر تحميل السياسات، حاول لاحقًا.";
  });

// ==================== عرض القائمة ====================
function renderPolicyMenu(policies) {
  policyMenu.innerHTML = "";
  errorMessage.textContent = "";
  policies.forEach(item => {
    const btn = document.createElement("button");
    btn.className = "button btn-primary";
    btn.textContent = item.title;
    btn.onclick = () => openPolicy(item.filename);
    policyMenu.appendChild(btn);
  });
}

// ==================== عرض الملف ====================
function openPolicy(filename) {
  const viewUrl = `/pdfs/${filename}`;
  const downloadUrl = `/pdfs/${filename}`;

  policyViewer.src = `/pdfjs/web/viewer.html?file=${encodeURIComponent(viewUrl)}`;
  policyContainer.style.display = "block";
  policyContainer.scrollIntoView({ behavior: "smooth" });

  downloadBtn.onclick = () => window.open(downloadUrl, "_blank");

  printBtn.onclick = () => {
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = downloadUrl;
    document.body.appendChild(iframe);
    iframe.onload = () => {
      iframe.contentWindow.print();
      document.body.removeChild(iframe);
    };
  };

  closeBtn.onclick = () => {
    policyContainer.style.display = "none";
    policyViewer.src = "";
  };
}

// ==================== أزرار التنقل ====================
document.getElementById("backBtn").onclick = () => {
  window.location.href = "/dashboard.html?role=" + role;
};

document.getElementById("exitBtn").onclick = () => {
  document.body.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;">
      <h2>👋 تم إنهاء الجلسة</h2>
      <p>يمكنك الآن إغلاق الصفحة أو العودة لاحقاً.</p>
      <button onclick="window.location.href='/index.html'" style="margin-top:20px;padding:10px 20px;border:none;border-radius:8px;background:#2563eb;color:white;font-size:16px;">
        🔁 عودة للرئيسية
      </button>
    </div>
  `;
};
</script>

</body>
</html>
