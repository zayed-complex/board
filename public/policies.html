<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📄 السياسات</title>
<style>
body { font-family: "Tahoma", Arial, sans-serif; text-align: center; padding: 20px; background: #f4f6f8; }
h1 { margin-bottom: 20px; color: #333; }
#policyMenu { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-bottom: 20px; }
.policy-btn { padding: 12px 20px; font-size: 1em; cursor: pointer; border: none; border-radius: 8px; background: #3498db; color: #fff; transition: 0.2s; min-width: 220px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.policy-btn:hover { background: #217dbb; transform: translateY(-2px); }

#policyContainer { display: none; width: 90%; margin: 20px auto; position: relative; }
#policyViewer { width: 100%; height: 600px; border: 1px solid #ccc; border-radius: 8px; }
#policyControls { display: flex; justify-content: center; gap: 15px; margin-bottom: 10px; position: static; z-index: 10; }
.pdf-btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em; color: white; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
#downloadBtn { background-color: #3498db; } #downloadBtn:hover { background-color: #217dbb; }
#printBtn { background-color: #f39c12; } #printBtn:hover { background-color: #d68910; }
#closeBtn { background-color: #e74c3c; } #closeBtn:hover { background-color: #c0392b; }
#errorMessage { color: red; margin-top: 15px; }
@media (max-width: 768px) {
  #policyViewer { height: 80vh; }
  #policyControls { flex-direction: row; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .pdf-btn { flex: 1 1 45%; min-width: 100px; justify-content: center; }
  .policy-btn { width: 90%; font-size: 1em; padding: 10px; }
}
</style>
</head>
<body>

<h1 id="pageTitle">📄 السياسات</h1>
<div id="policyMenu"></div>
<div id="errorMessage"></div>

<div id="policyContainer">
  <div id="policyControls">
    <button class="pdf-btn" id="downloadBtn">⬇ تحميل PDF</button>
    <button class="pdf-btn" id="printBtn">🖨️ طباعة PDF</button>
    <button class="pdf-btn" id="closeBtn">❌ إغلاق الملف</button>
  </div>
  <iframe id="policyViewer"></iframe>
</div>

<script>
const policyMenu = document.getElementById("policyMenu");
const policyContainer = document.getElementById("policyContainer");
const policyViewer = document.getElementById("policyViewer");
const downloadBtn = document.getElementById("downloadBtn");
const printBtn = document.getElementById("printBtn");
const closeBtn = document.getElementById("closeBtn");
const pageTitle = document.getElementById("pageTitle");
const errorMessage = document.getElementById("errorMessage");

const params = new URLSearchParams(window.location.search);
const role = params.get("role") || sessionStorage.getItem("role") || "student";

pageTitle.textContent = role === "staff"
  ? "📄 سياسات الكادر الإداري والتدريسي"
  : "📄 سياسات الطالب / ولي الأمر";

fetch(`/api/policies/${role}`)
  .then(res => {
    if (!res.ok) throw new Error(`خطأ في استجابة السيرفر (${res.status})`);
    return res.json();
  })
  .then(policies => {
    if (!Array.isArray(policies) || policies.length === 0) {
      errorMessage.textContent = "⚠️ لا توجد سياسات لهذا الدور حالياً.";
      return;
    }
    renderPolicyMenu(policies);
  })
  .catch(err => {
    console.error("خطأ في تحميل السياسات:", err);
    errorMessage.textContent = "❌ تعذر تحميل السياسات، حاول مرة أخرى لاحقاً.";
  });

function renderPolicyMenu(policies) {
  policyMenu.innerHTML = "";
  errorMessage.textContent = "";
  policies.forEach(item => {
    const btn = document.createElement("button");
    btn.className = "policy-btn";
    btn.textContent = item.title;
    btn.onclick = () => openPolicy(item.filename);
    policyMenu.appendChild(btn);
  });
}

function openPolicy(filename) {
  const viewUrl = `/pdfs/${filename}`;
  const downloadUrl = `/pdfs/${filename}`;

  policyViewer.src = `/pdfjs/web/viewer.html?file=${encodeURIComponent(viewUrl)}`;
  policyContainer.style.display = "block";
  policyContainer.scrollIntoView({ behavior: "smooth" });

  downloadBtn.onclick = () => window.open(downloadUrl, "_blank");
  printBtn.onclick = () => {
    const printFrame = document.createElement('iframe');
    printFrame.style.display = 'none';
    printFrame.src = downloadUrl;
    document.body.appendChild(printFrame);
    printFrame.contentWindow.focus();
    printFrame.contentWindow.print();
  };
  closeBtn.onclick = () => {
    policyContainer.style.display = "none";
    policyViewer.src = "";
  };
}
</script>

</body>
</html>
