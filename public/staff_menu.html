<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم الموظف</title>
<style>
  body { font-family: Arial,sans-serif; text-align:center; padding:20px; background:#f4f6f8; }
  #menuContainer { display:flex; flex-wrap:wrap; justify-content:center; gap:15px; }
  .menu-btn { padding:12px 20px; font-size:1em; cursor:pointer; border:none; border-radius:8px;
              background:#3498db; color:white; transition:0.2s; min-width:200px; box-shadow:0 4px 6px rgba(0,0,0,0.1);}
  .menu-btn:hover { background:#217dbb; transform:translateY(-2px); }
  #pdfDownloadContainer { margin-top:10px; display:none; }
  #downloadBtn { padding:10px 15px; background:#2ecc71; color:white; border:none; border-radius:6px;
                 cursor:pointer; font-size:1em; }
  #downloadBtn:hover { background:#27ae60; }
</style>
</head>
<body>

<h1>💼 لوحة تحكم الموظف</h1>
<div id="menuContainer"></div>
<div id="pdfDownloadContainer">
  <button id="downloadBtn">⬇ تحميل PDF</button>
</div>

<script>
const container = document.getElementById("menuContainer");
const downloadContainer = document.getElementById("pdfDownloadContainer");
const downloadBtn = document.getElementById("downloadBtn");

// تحميل القائمة حسب الدور
async function loadMenu(role) {
  container.innerHTML = "";
  if (!role) return;

  try {
    const res = await fetch(`/api/menu/${role}`);
    const menu = await res.json();
    menu.forEach(item => {
      const btn = document.createElement("button");
      btn.className = "menu-btn";
      btn.textContent = item.title;

      btn.onclick = () => {
        switch(item.type) {
          case "pdf":
            openPdf(item.filename);
            break;
          case "page":
            window.location.href = item.path;
            break;
          case "external":
            window.open(item.url, "_blank");
            break;
          case "submenu":
            window.location.href = `/policies.html?role=${role}`;
            break;
        }
      };

      container.appendChild(btn);
    });
  } catch(err) {
    container.innerHTML = "<p>تعذر تحميل القائمة</p>";
    console.error(err);
  }
}

// فتح PDF + التعامل مع التنزيل على كل المتصفحات
function openPdf(filename) {
  if (!filename) return;
  const pdfUrl = `/api/pdfs/${filename}`;

  // افتح PDF في نافذة جديدة
  window.open(pdfUrl, "_blank");

  // اظهار زر التحميل
  downloadContainer.style.display = "block";

  downloadBtn.onclick = (e) => {
    e.preventDefault();

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    if (isIOS) {
      // iOS: فتح في تبويب جديد حيث يمكن للمستخدم حفظ الملف
      window.open(pdfUrl, "_blank");
    } else {
      // باقي المتصفحات: تحميل مباشر
      const link = document.createElement("a");
      link.href = pdfUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  };
}

// تحميل القائمة عند تحميل الصفحة
document.addEventListener("DOMContentLoaded", () => {
  const role = sessionStorage.getItem("role") || "staff"; // default role
  loadMenu(role);
});
</script>

</body>
</html>
