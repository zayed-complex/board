<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💼 لوحة تحكم الموظف</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 30px; background: #f4f6f8; }
  h1 { margin-bottom: 30px; color: #333; }
  #menuContainer { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
  .menu-btn {
    padding: 12px 20px; font-size: 1em; cursor: pointer; border: none;
    border-radius: 8px; background: #3498db; color: #fff; transition: 0.2s;
    min-width: 200px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .menu-btn:hover { background: #217dbb; transform: translateY(-2px); }
  #pdfViewer {
    width: 90%; height: 600px; border: 1px solid #ccc; border-radius: 8px;
    margin: 20px auto; display: none;
  }
  #pdfDownloadContainer { margin-top: 10px; display: none; }
  #downloadBtn {
    padding: 10px 15px; background-color: #2ecc71; color: white;
    border: none; border-radius: 6px; cursor: pointer; font-size: 1em;
  }
  #downloadBtn:hover { background-color: #27ae60; }
</style>
</head>
<body>

<h1>💼 لوحة تحكم الموظف</h1>
<div id="menuContainer"></div>

<iframe id="pdfViewer"></iframe>

<div id="pdfDownloadContainer">
  <button id="downloadBtn">⬇ تحميل PDF</button>
</div>

<script>
const staffMenu = [
  { title: "جداول الحلقة الثانية", type: "pdf", filename: "cycle2.pdf" },
  { title: "جداول الحلقة الثالثة", type: "pdf", filename: "cycle3.pdf" },
  { title: "جداول المعلمين", type: "pdf", filename: "teachers.pdf" },
  { title: "جداول المناوبة", type: "pdf", filename: "duties.pdf" },
  { title: "التوقيت الزمني للحصص", type: "pdf", filename: "timings.pdf" },
  { title: "أرقام التواصل", type: "pdf", filename: "numbers.pdf" },
  { title: "السياسات", type: "submenu", role: "staff" },
  { title: "الشؤون الأكاديمية", type: "external", url: "https://tinyurl.com/dcy9xtdk"},
  { title: "منصة ألف", type: "external", url: "https://www.alefed.com" },
  { title: "الغياب والحضور اليومي", type: "external", url: "https://emiratesschoolsese-my.sharepoint.com/" },
  { title: "رحلتي", type: "external", url: "https://idh.moe.gov.ae/" },
  { title: "المنهل", type: "external", url: "https://sis.moe.gov.ae/" },
{ title: "منهاجي", type: "external", url: "https://minhaji.moe.gov.ae/library" },
  { title: "بوابة التعلم الذكي", type: "external", url: "https://lms.moe.gov.ae/" }
];

const container = document.getElementById("menuContainer");
const pdfViewer = document.getElementById("pdfViewer");
const downloadContainer = document.getElementById("pdfDownloadContainer");
const downloadBtn = document.getElementById("downloadBtn");

staffMenu.forEach(item => {
  const btn = document.createElement("button");
  btn.className = "menu-btn";
  btn.textContent = item.title;

  btn.onclick = () => {
    downloadContainer.style.display = "none";

    switch(item.type) {
      case "pdf":
        const viewUrl = `/api/pdfs/${item.filename}`;
        const downloadUrl = `/api/pdfs/download/${item.filename}`;

        pdfViewer.src = `/pdfjs/web/viewer.html?file=${encodeURIComponent(viewUrl)}`;
        pdfViewer.style.display = "block";
        pdfViewer.scrollIntoView({ behavior: "smooth" });

        downloadBtn.onclick = () => { window.open(downloadUrl, "_blank"); };
        downloadContainer.style.display = "block";
        break;

      case "submenu":
        window.location.href = `/policies.html?role=${item.role}`;
        break;

      case "external":
        window.open(item.url, "_blank");
        break;
    }
  };

  container.appendChild(btn);
});
</script>
</body>
</html>
