<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقرير الطالب</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <img src="logo.png" alt="شعار المدرسة" class="logo" />
    <h1>تقرير الطالب</h1>
  </header>

  <main>
    <input id="studentId" placeholder="أدخل رقم الهوية" />
    <button onclick="searchReport()">بحث</button>

    <div id="report"></div>
  </main>

  <script>
    // قراءة role وsection من الرابط
    const params = new URLSearchParams(window.location.search);
    const role = params.get("role") || "student";
    const section = params.get("section") || "male";

    // حفظ في sessionStorage كنسخة احتياطية
    sessionStorage.setItem("role", role);
    sessionStorage.setItem("section", section);

    async function searchReport() {
      const id = document.getElementById("studentId").value.trim();
      if (!id) {
        alert("الرجاء إدخال رقم الهوية");
        return;
      }

      try {
        const res = await fetch(`/api/report/${id}?section=${section}`);
        const data = await res.json();

        const container = document.getElementById("report");
        container.innerHTML = "";

        if (data.error) {
          container.innerHTML = `<p style="color:red">${data.error}</p>`;
          return;
        }

        const info = document.createElement("div");
        info.innerHTML = `<h2>${data.student["الاسم"]}</h2>
                          <p>الشعبة: ${data.student["الشعبة"]}</p>`;
        container.appendChild(info);

        const table = document.createElement("table");
        table.innerHTML = `
          <thead>
            <tr>
              <th>المادة</th>
              <th>تكويني</th>
              <th>مشاركة</th>
              <th>مهمة</th>
              <th>التزام</th>
              <th>ملاحظة</th>
            </tr>
          </thead>
          <tbody>
            ${data.subjects
              .map(
                s => `
              <tr>
                <td>${s.name}</td>
                <td>${s.formative}</td>
                <td>${s.participation}</td>
                <td>${s.task}</td>
                <td>${s.commitment}</td>
                <td>${s.note}</td>
              </tr>`
              )
              .join("")}
          </tbody>
        `;
        container.appendChild(table);
      } catch (err) {
        console.error(err);
        alert("حدث خطأ أثناء تحميل التقرير");
      }
    }
  </script>
</body>
</html>
