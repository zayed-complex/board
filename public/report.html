<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تقرير طالب</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 id="reportTitle">📑 تقرير طالب</h1>

    <div class="search-box">
      <input type="text" id="studentId" placeholder="أدخل رقم الهوية">
      <button id="searchBtn">عرض التقرير</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    // تحديد القسم من الرابط
    const params = new URLSearchParams(window.location.search);
    const section = params.get("section") || "male";

    // تغيير العنوان حسب القسم
    const titleEl = document.getElementById("reportTitle");
    if (section === "female") {
      titleEl.textContent = "📑 تقرير طالبة";
    } else {
      titleEl.textContent = "📑 تقرير طالب";
    }

    document.getElementById("searchBtn").addEventListener("click", async () => {
      const id = document.getElementById("studentId").value.trim();
      const res = await fetch(`/api/report/${id}`);
      const data = await res.json();
      const result = document.getElementById("result");

      if (data.error) {
        result.innerHTML = `<p style="color:red">${data.error}</p>`;
        return;
      }

      // نص مجمع زايد حسب القسم
      const schoolText =
        section === "female"
          ? "مجمع زايد التعليمي - الظيت / قسم الإناث"
          : "مجمع زايد التعليمي - الظيت / قسم البنين";

      // عرض بيانات الطالب
      let html = `
        <div class="student-info">
          <img src="/icons/logo.png" alt="شعار المدرسة">
          <p><strong>${schoolText}</strong></p>
          <p><strong>الاسم:</strong> ${data.student["الاسم"]}</p>
          <p><strong>الشعبة:</strong> ${data.student["الشعبة"]}</p>
        </div>
        <table>
          <thead>
            <tr>
              <th>المادة</th>
              <th>تكويني</th>
              <th>مشاركة</th>
              <th>مهمة</th>
              <th>التزام</th>
            </tr>
          </thead>
          <tbody>
      `;

      data.subjects.forEach(sub => {
        html += `
          <tr>
            <td>${sub.name}</td>
            <td>${sub.formative}</td>
            <td>${sub.participation}</td>
            <td>${sub.task}</td>
            <td>${sub.commitment}</td>
          </tr>
        `;
      });

      html += "</tbody></table>";
      result.innerHTML = html;
    });
  </script>
</body>
</html>
