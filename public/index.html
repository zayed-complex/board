<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 الصفحة الرئيسية</title>
<style>
body {
  font-family: "Tahoma", Arial, sans-serif;
  background: #f2f5f8;
  text-align: center;
  padding: 30px;
}
h1 { color: #333; }
select, button {
  padding: 10px 15px;
  margin: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 1em;
}
button {
  background: #3498db;
  color: white;
  border: none;
  cursor: pointer;
}
button:hover { background: #217dbb; }
</style>
</head>
<body>
  <h1>🎓 بوابة المدرسة</h1>
  <p>اختر القسم والدور للدخول</p>

  <label>القسم:</label>
  <select id="genderSelect">
    <option value="male">بنين</option>
    <option value="female">بنات</option>
  </select>

  <br>

  <label>الدور:</label>
  <select id="roleSelect">
    <option value="student">طالب / ولي أمر</option>
    <option value="staff">معلم / إداري</option>
  </select>

  <br>

  <button id="enterBtn">دخول</button>

<script>
document.getElementById("enterBtn").onclick = () => {
  const role = document.getElementById("roleSelect").value;
  const gender = document.getElementById("genderSelect").value;

  sessionStorage.setItem("role", role);
  sessionStorage.setItem("gender", gender);

  // الانتقال مع تمرير الدور والقسم
  window.location.href = `dashboard.html?role=${role}&gender=${gender}`;
};
</script>
</body>
</html>
