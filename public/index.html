<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - مجمع زايد التعليمي</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!-- إعدادات PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #1976d2;
      --primary-dark: #0d47a1;
      --accent: #e3f2fd;
      --danger: #e53935;
      --success: #43a047;
    }

    body {
      font-family: "Cairo", sans-serif;
      background: linear-gradient(135deg, var(--accent), #bbdefb);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .login-card {
      background: #fff;
      padding: 40px 30px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 340px;
      position: relative;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: -70px auto 15px;
      overflow: hidden;
    }

    .logo img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }

    h1 {
      font-size: 1.3em;
      color: var(--primary-dark);
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1em;
      color: #555;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 8px 0 4px;
      color: #333;
      font-size: 0.9em;
      text-align: right;
    }

    select, input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 0.95em;
      text-align: center;
      transition: 0.3s;
    }

    select:focus, input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
      outline: none;
    }

    button {
      width: 100%;
      padding: 11px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 600;
      transition: 0.3s;
    }

    button:hover {
      background-color: var(--primary-dark);
      transform: translateY(-1px);
    }

    .hidden {
      display: none;
    }

    #loginMessage {
      color: var(--danger);
      margin-top: 10px;
      font-size: 0.9em;
      min-height: 20px;
    }

    footer {
      margin-top: 20px;
      color: #777;
      font-size: 0.8em;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="logo">
      <img src="icons/logo.png" alt="شعار المدرسة" />
    </div>

    <h1>منصة</h1>
    <h2>مجمّع زايد التعليمي</h2>

    <label for="sectionSelect">اختر القسم</label>
    <select id="sectionSelect">
      <option value="">-- اختر القسم --</option>
      <option value="male">قسم الذكور</option>
      <option value="female">قسم الإناث</option>
    </select>

    <label for="roleSelect">اختر الدور</label>
    <select id="roleSelect" onchange="handleRoleChange()">
      <option value="">-- اختر الدور --</option>
      <option value="student"> طالب / ولي أمر</option>
      <option value="staff"> معلم / إداري</option>
    </select>

    <div id="loginFields" class="hidden">
      <label>اسم المستخدم</label>
      <input type="text" id="username" placeholder="أدخل اسم المستخدم" />
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="أدخل كلمة المرور" />
      <button onclick="login()">تسجيل الدخول</button>
      <p id="loginMessage"></p>
    </div>

    <footer>
      © 2025 - جميع الحقوق محفوظة<br>
      مجمّع زايد التعليمي - الظيت
    </footer>
  </div>

  <script>
    function handleRoleChange() {
      const role = document.getElementById("roleSelect").value;
      const section = document.getElementById("sectionSelect").value || "male";
      const loginFields = document.getElementById("loginFields");
      const msg = document.getElementById("loginMessage");
      if (msg) msg.textContent = "";

      if (!role) return;

      if (role === "staff") {
        loginFields.classList.remove("hidden");
      } else if (role === "student") {
        sessionStorage.setItem("role", "student");
        sessionStorage.setItem("section-role", section);
        window.location.href = `dashboard.html?role=student&section=${section}`;
      }
    }

    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const section = document.getElementById("sectionSelect").value || "male";
      const msg = document.getElementById("loginMessage");
      msg.textContent = "";

      if (!username || !password) {
        msg.textContent = "❌ يرجى إدخال اسم المستخدم وكلمة المرور";
        return;
      }

      const validUsers = [
        { username: "admin", password: "1234" },
        { username: "staff", password: "abcd" }
      ];

      const user = validUsers.find(u => u.username === username && u.password === password);
      if (user) {
        sessionStorage.setItem("role", "staff");
        sessionStorage.setItem("section-role", section);
        window.location.href = `dashboard.html?role=staff&section=${section}`;
      } else {
        msg.textContent = "❌ اسم المستخدم أو كلمة المرور خاطئة";
      }
    }
  </script>

  <script>
    // تسجيل الـ Service Worker
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/service-worker.js")
        .then(() => console.log("✅ Service Worker مسجّل"))
        .catch(err => console.error("❌ فشل تسجيل Service Worker:", err));
    }

    // تسجيل التطبيق كـ PWA
    if (window.matchMedia('(display-mode: standalone)').matches) {
      console.log("📱 التطبيق يعمل كـ PWA");
    }
  </script>
</body>
</html>
