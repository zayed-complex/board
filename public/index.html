<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول - مجمّع زايد التعليمي</title>
<style>
body { font-family: "Tahoma", Arial, sans-serif; text-align: center; padding: 50px; background: #f4f6f8; }
h1 { margin-bottom: 30px; color: #333; }
select, input, button { font-size: 16px; margin: 5px; padding: 8px; }
button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; background: #3498db; color: #fff; transition: 0.2s; }
button:hover { background: #217dbb; transform: translateY(-2px); }
.hidden { display: none; }
footer { text-align: center; padding: 15px; font-size: 0.9em; color: #777; margin-top: 50px; }
</style>
</head>
<body>

<h1>🔐 نظام الدخول الموحّد</h1>
<h2>مرحباً بك في مجمّع زايد التعليمي - الظيت</h2>

<!-- اختيار القسم -->
<label for="section">اختر القسم</label>
<select id="section">
  <option value="">-- اختر القسم --</option>
  <option value="male">👨 قسم الذكور</option>
  <option value="female">👩 قسم الإناث</option>
</select>

<!-- اختيار الدور -->
<div id="roleDiv" class="hidden" style="margin-top:20px;">
  <label for="role">خيارات الدخول</label>
  <select id="role">
    <option value="">-- اختر الدور --</option>
    <option value="student">👨‍🎓 طالب / ولي الأمر</option>
    <option value="staff">🧑‍🏫 معلم / إداري</option>
  </select>
</div>

<!-- حقول الموظفين -->
<div id="staffFields" class="hidden" style="margin-top:15px;">
  <label for="username">اسم المستخدم</label>
  <input type="text" id="username" placeholder="أدخل اسم المستخدم" />

  <label for="password">كلمة المرور</label>
  <input type="password" id="password" placeholder="أدخل كلمة المرور" />

  <button id="loginBtn">تسجيل الدخول</button>
  <p id="loginMessage" style="color:red; margin-top:10px;"></p>
</div>

<footer>
  <p>© جميع الحقوق محفوظة - مجمّع زايد التعليمي - الظيت</p>
</footer>

<script>
const sectionSelect = document.getElementById("section");
const roleDiv = document.getElementById("roleDiv");
const roleSelect = document.getElementById("role");
const staffFields = document.getElementById("staffFields");
const msg = document.getElementById("loginMessage");
const loginBtn = document.getElementById("loginBtn");

// عند اختيار القسم
sectionSelect.addEventListener("change", () => {
  const section = sectionSelect.value;
  if (section) {
    roleDiv.classList.remove("hidden");
    staffFields.classList.add("hidden");
    roleSelect.value = "";
    sessionStorage.setItem("section", section);
  } else {
    roleDiv.classList.add("hidden");
    staffFields.classList.add("hidden");
  }
});

// عند اختيار الدور
roleSelect.addEventListener("change", () => {
  const role = roleSelect.value;
  const section = sessionStorage.getItem("section");

  msg.textContent = "";

  if (role === "student") {
    sessionStorage.setItem("role", "student");
    window.location.href = `dashboard.html?section=${section}&role=student`;
  } else if (role === "staff") {
    staffFields.classList.remove("hidden");
  } else {
    staffFields.classList.add("hidden");
  }
});

// تسجيل الدخول للموظفين
loginBtn.addEventListener("click", () => {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const section = sessionStorage.getItem("section");

  msg.textContent = "";

  if (!username || !password) {
    msg.textContent = "❌ يرجى إدخال اسم المستخدم وكلمة المرور";
    return;
  }

  if (username === "admin" && password === "1234") {
    sessionStorage.setItem("role", "staff");
    window.location.href = `dashboard.html?section=${section}&role=staff`;
  } else {
    msg.textContent = "❌ بيانات الدخول غير صحيحة";
  }
});
</script>

</body>
</html>
